<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Mini Pokédex</title><style>
:root{font-family:system-ui,Arial,sans-serif;background:#f3f5fa;color:#192841}*{box-sizing:border-box}body{margin:0}header{background:#eb3f47;color:white;padding:28px 16px;text-align:center;border-bottom:7px solid #bb2632}h1{margin:0;font-size:clamp(28px,5vw,44px)}header p{margin:8px 0 0}.container{max-width:960px;margin:auto;padding:25px 16px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}input,select,button{padding:12px;border:2px solid #cbd5e1;border-radius:10px;font-size:16px}input{flex:1;min-width:190px}button{background:#273e61;color:white;cursor:pointer;border:0;font-weight:bold}button.active{background:#eb3f47}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:16px}.card{background:white;border:2px solid #e2e8f0;border-radius:16px;padding:17px;text-align:center;box-shadow:0 6px 15px #14264211;transition:transform .2s}.card:hover{transform:translateY(-4px)}.number{color:#64748b;font-size:13px}.art{height:100px;display:grid;place-items:center;font-size:68px;text-shadow:0 4px #0001}.card h2{font-size:21px;margin:7px 0}.type{display:inline-block;background:#e2eaf5;border-radius:20px;padding:5px 10px;font-size:13px}.heart{margin-top:12px;border-radius:8px;padding:9px 15px}.heart.saved{background:#ec4b55}footer{text-align:center;color:#64748b;font-size:13px;padding:24px}#empty{display:none;text-align:center;padding:30px}
</style></head><body><header><h1>🔴 Mi Mini Pokédex</h1><p>¡Descubre Pokémon y guarda tus favoritos!</p></header><main class="container"><div class="controls"><input id="search" placeholder="Buscar un Pokémon..." aria-label="Buscar Pokémon"><select id="type" aria-label="Filtrar por tipo"><option value="">Todos los tipos</option></select><button id="favorites">❤️ Mis favoritos</button></div><div id="cards" class="cards"></div><p id="empty">No se encontraron Pokémon 🔎</p></main><footer>Proyecto educativo de fans, no oficial. Personajes y nombres pertenecen a sus respectivos titulares.</footer><script>
const pokemon=[['Bulbasaur','Planta','🌱'],['Ivysaur','Planta','🌿'],['Venusaur','Planta','🌴'],['Charmander','Fuego','🔥'],['Charmeleon','Fuego','🦎'],['Charizard','Fuego','🐉'],['Squirtle','Agua','🐢'],['Wartortle','Agua','🐢'],['Blastoise','Agua','🐢'],['Caterpie','Bicho','🐛'],['Butterfree','Bicho','🦋'],['Pikachu','Eléctrico','⚡'],['Raichu','Eléctrico','⚡'],['Sandshrew','Tierra','🦔'],['Vulpix','Fuego','🦊'],['Jigglypuff','Hada','🎤'],['Zubat','Veneno','🦇'],['Oddish','Planta','🌸'],['Diglett','Tierra','🕳️'],['Meowth','Normal','🐱'],['Psyduck','Agua','🦆'],['Growlithe','Fuego','🐕'],['Poliwag','Agua','🌀'],['Abra','Psíquico','🔮'],['Machop','Lucha','💪'],['Geodude','Roca','🪨'],['Ponyta','Fuego','🐴'],['Magnemite','Eléctrico','🧲'],['Gastly','Fantasma','👻'],['Onix','Roca','🐍'],['Krabby','Agua','🦀'],['Cubone','Tierra','🦴'],['Koffing','Veneno','☁️'],['Chansey','Normal','🥚'],['Staryu','Agua','⭐'],['Scyther','Bicho','🦗'],['Magikarp','Agua','🐟'],['Lapras','Agua','🦕'],['Eevee','Normal','🦊'],['Snorlax','Normal','😴'],['Dragonite','Dragón','🐲'],['Mewtwo','Psíquico','🧠'],['Mew','Psíquico','✨']];
let favorites=JSON.parse(localStorage.getItem('mini-pokedex-favs')||'[]');let onlyFavorites=false;const search=document.querySelector('#search'),type=document.querySelector('#type'),cards=document.querySelector('#cards');[...new Set(pokemon.map(p=>p[1]))].sort().forEach(t=>{let o=document.createElement('option');o.value=o.textContent=t;type.append(o)});function render(){let query=search.value.trim().toLowerCase();let data=pokemon.map((p,i)=>({p,i})).filter(({p,i})=>p[0].toLowerCase().includes(query)&&(!type.value||p[1]===type.value)&&(!onlyFavorites||favorites.includes(i)));cards.innerHTML='';data.forEach(({p,i})=>{let el=document.createElement('article');el.className='card';let saved=favorites.includes(i);el.innerHTML=`<div class="number">#${String(i+1).padStart(3,'0')}</div><div class="art">${p[2]}</div><h2>${p[0]}</h2><span class="type">${p[1]}</span><div><button class="heart ${saved?'saved':''}" aria-label="Favorito: ${p[0]}">${saved?'❤️ Guardado':'🤍 Favorito'}</button></div>`;el.querySelector('button').onclick=()=>{favorites=saved?favorites.filter(n=>n!==i):[...favorites,i];localStorage.setItem('mini-pokedex-favs',JSON.stringify(favorites));render()};cards.append(el)});document.querySelector('#empty').style.display=data.length?'none':'block'}search.oninput=render;type.onchange=render;document.querySelector('#favorites').onclick=e=>{onlyFavorites=!onlyFavorites;e.target.classList.toggle('active',onlyFavorites);e.target.textContent=onlyFavorites?'📋 Ver todos':'❤️ Mis favoritos';render()};render();
</script></body></html>
